# Backend server configuration
server.port=8000

# PostgreSQL local database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/digital_library
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT settings for local learning. In production, keep the secret in AWS Secrets Manager or environment variables.
app.jwt.secret=local-development-secret-key-change-before-production-123456
app.jwt.expiration-ms=86400000

# Local storage now, S3 later. Backend serves files from this folder through /api/files/{fileName}.
app.storage.local-folder=local-storage
