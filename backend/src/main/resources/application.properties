# Backend server configuration
server.port=8000

# PostgreSQL configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/digital_library}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Local storage
app.storage.local-folder=${APP_STORAGE_LOCAL_FOLDER:local-storage}

# Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# AWS Configuration
aws.region=${AWS_REGION:us-east-1}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:digital-library-storage}
aws.ses.from-email=${AWS_SES_FROM_EMAIL:noreply@digitallibrary.com}
aws.sns.sender-id=${AWS_SNS_SENDER_ID:DIGILIB}
aws.mock-enabled=${AWS_MOCK_ENABLED:true}