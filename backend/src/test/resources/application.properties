# Test profile — uses H2 in-memory database, disables Flyway, mocks AWS
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

# Disable Redis for tests — use in-memory simple cache. No Redis server runs
# in CI, so exclude its autoconfiguration entirely rather than pointing
# StringRedisTemplate at a host that will never accept connections (the
# health check needs to see Redis as absent, not as a live outage).
spring.cache.type=simple
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
spring.data.redis.repositories.enabled=false

# JWT
app.jwt.secret=test-secret-key-that-is-long-enough-for-hmac-sha256-algorithm
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-days=7

# AWS mocked
aws.mock-enabled=true
aws.region=us-east-1
aws.access-key-id=test
aws.secret-access-key=test
aws.s3.bucket-name=test-bucket
aws.ses.from-email=test@test.com
aws.sns.sender-id=TEST

# Storage
app.storage.local-folder=test-storage

# CORS
app.cors.allowed-origins=http://localhost:3000

# Payment webhooks
app.payment.webhook-secret.mock=test-mock-webhook-secret
app.payment.webhook-secret.stripe=
app.payment.webhook-secret.razorpay=
