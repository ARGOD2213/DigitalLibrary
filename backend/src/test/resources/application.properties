# Test profile — uses H2 in-memory database, disables Flyway, mocks AWS
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

# Disable Redis for tests — use in-memory simple cache
spring.cache.type=simple
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false

# JWT
app.jwt.secret=test-secret-key-that-is-long-enough-for-hmac-sha256-algorithm
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-days=7

# AWS mocked
aws.mock-enabled=true
aws.region=us-east-1
aws.access-key-id=test
aws.secret-access-key=test
aws.s3.bucket-name=test-bucket
aws.ses.from-email=test@test.com
aws.sns.sender-id=TEST

# Storage
app.storage.local-folder=test-storage
